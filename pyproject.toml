[project]
name = "lower-thirds"
version = "0.1.0"
description = "Desktop app for managing and displaying lower thirds on video streams"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pyqt6>=6.6.0",
]

[project.scripts]
lower-thirds = "lower_thirds.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lower_thirds"]
